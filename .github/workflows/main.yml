name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest vcpkg commit
        id: vcpkg-commit
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/microsoft/vcpkg HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg (installs deps from vcpkg.json)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          vcpkgGitCommitId: ${{ steps.vcpkg-commit.outputs.sha }}

      - name: Configure CMake
        run: |
          cmake -B build -S . -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Bundle runtime DLLs next to the exe
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/scripts/buildsystems/msbuild/applocal.ps1" `
            -targetBinary "build/Release/vmp-lift.exe" `
            -installedDir "build/vcpkg_installed/x64-windows/bin"
          Write-Host "===== files that will be uploaded ====="
          Get-ChildItem "build/Release" | Select-Object -ExpandProperty Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmp-lift-windows-x64
          path: |
            build/Release/vmp-lift.exe
            build/Release/*.dll
          if-no-files-found: error
